/* ---------- engraved guilloche backdrop + animated provenance certificate ---------- */
let artRAF = null, certTimer = null;
function startArt(){
  const c = document.getElementById("guilloche"); if(!c){ stopArt(); return; }
  if(c.dataset.on) return; c.dataset.on = "1";
  const ctx = c.getContext("2d"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const r = c.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio||1);
  c.width = r.width*dpr; c.height = r.height*dpr;
  const W = c.width, H = c.height, cx = W*0.82, cy = H*0.42, R = Math.max(W,H)*0.55;
  let t = 0;
  const draw = () => {
    if(!document.body.contains(c)){ artRAF=null; return; }
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth = dpr*0.8;
    for(let k=0;k<14;k++){
      const rr = R*(0.35+k*0.05);
      ctx.strokeStyle = k%4===0 ? "rgba(215,182,110,.30)" : "rgba(200,212,235,.12)";
      ctx.beginPath();
      for(let i=0;i<=720;i++){
        const a = i/720*Math.PI*2;
        const m = rr + Math.sin(a*18 + t + k*0.4)*R*0.035 + Math.cos(a*7 - t*0.6)*R*0.02;
        const x = cx + Math.cos(a)*m, y = cy + Math.sin(a)*m*0.92;
        i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
      }
      ctx.stroke();
    }
    t += 0.0035;
    artRAF = reduce ? null : requestAnimationFrame(draw);
  };
  draw();
  const cert = document.getElementById("cert");
  if(cert && !certTimer){
    let k = 0;
    const tick = async () => {
      const el = document.getElementById("cert"); if(!el){ clearInterval(certTimer); certTimer=null; return; }
      const steps = el.querySelectorAll(".cert-steps div"); const seal = el.querySelector(".cert-seal");
      steps.forEach((s,i)=>s.classList.toggle("on", i<=k));
      seal.classList.toggle("on", k>=3);
      const h = document.getElementById("cert-hash"); if(h) h.textContent = (k>=1? "block 6,1"+(28440+k*3)+" · ":"") + await sha256("PL-2026-0118"+k);
      k = (k+1) % 6;
    };
    tick(); if(!reduce) certTimer = setInterval(tick, 1500);
  }
}
function stopArt(){ if(artRAF){ cancelAnimationFrame(artRAF); artRAF=null; } if(certTimer){ clearInterval(certTimer); certTimer=null; } }

/* ---------- real Google and ORCID sign-in ----------
   Fill in the client IDs once PeerLibre is hosted on its own domain (see README). Inside the claude.ai preview
   third-party sign-in can't run, so these buttons fall back to a clearly labelled demo profile. */
const AUTH_CONFIG = {
  googleClientId: "",      // Google Cloud console > APIs & Services > Credentials > OAuth client ID (Web)
  orcidClientId: "",       // orcid.org/developer-tools (Public API client), e.g. "APP-XXXXXXXXXXXXXXXX"
  orcidBase: "https://orcid.org"   // use "https://sandbox.orcid.org" while testing
};
const AUTH = {
  hosted(){ return location.protocol==="https:" || location.hostname==="localhost"; },
  live(p){ return this.hosted() && !!(p==="google" ? AUTH_CONFIG.googleClientId : AUTH_CONFIG.orcidClientId); }
};
function decodeJwt(t){ try{ const p=t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"); return JSON.parse(decodeURIComponent(escape(atob(p)))); }catch(e){ return {}; } }
async function googleSignIn(){
  if(!AUTH.live("google")) return demoProvider("google");
  try{
    await loadScript("https://accounts.google.com/gsi/client");
    const client = google.accounts.oauth2.initTokenClient({client_id:AUTH_CONFIG.googleClientId, scope:"openid email profile",
      callback: async (resp) => {
        if(resp.error){ toast("Google sign-in was cancelled."); return; }
        const r = await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:"Bearer "+resp.access_token}});
        const p = await r.json();
        startOnboard({method:"google", via:"google", verified:true, wallet:randAddr(), name:p.name||"", email:p.email||"", picture:p.picture||""});
      }});
    client.requestAccessToken();
  }catch(e){ toast("Google sign-in couldn't start. Check the client ID and authorised origins."); }
}
function orcidSignIn(){
  if(!AUTH.live("orcid")) return demoProvider("orcid");
  const state = rid(8); try{ sessionStorage.setItem("pl.orcid.state", state); }catch(e){}
  const redirect = location.origin + location.pathname;
  location.href = `${AUTH_CONFIG.orcidBase}/oauth/authorize?client_id=${encodeURIComponent(AUTH_CONFIG.orcidClientId)}&response_type=token&scope=openid&redirect_uri=${encodeURIComponent(redirect)}&state=${state}&nonce=${rid(8)}`;
}
function handleOrcidReturn(){
  if(!location.hash.includes("id_token=") && !location.hash.includes("access_token=")) return false;
  const q = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, "", location.pathname);
  let expected=null; try{ expected = sessionStorage.getItem("pl.orcid.state"); }catch(e){}
  try{ sessionStorage.removeItem("pl.orcid.state"); }catch(e){}
  if(!expected || q.get("state")!==expected){ toast("ORCID sign-in could not be verified. Please try again."); return false; }
  const p = decodeJwt(q.get("id_token")||"");
  const name = [p.given_name, p.family_name].filter(Boolean).join(" ");
  startOnboard({method:"orcid", via:"orcid", verified:true, wallet:randAddr(), name, orcid:p.sub||""});
  return true;
}
function demoProvider(p){
  const label = p==="google" ? "Google" : "ORCID";
  modal(`<div class="row">${p==="google"?I.google.replace('<svg','<svg width="28" height="28"'):I.orcid.replace('<svg','<svg width="28" height="28"')}<h3>${label} sign-in (preview)</h3></div>
    <p class="small muted">Real ${label} sign-in is built in and switches on once PeerLibre runs on its own website with a registered ${label} app. This preview can't open ${label}'s sign-in window, so enter the profile you'd like to test with.</p>
    <label class="field">Full name<input class="input" id="dp-name" placeholder="Dr. Jane Doe"></label>
    ${p==="google"?`<label class="field">Google email<input class="input" id="dp-email" type="email" placeholder="you@gmail.com"></label>`:`<label class="field">ORCID iD<input class="input mono" id="dp-orcid" placeholder="0000-0002-1825-0097"></label>`}
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary" data-act="demoProviderGo" data-p="${p}">Continue</button></div>`);
  setTimeout(()=>{ const n=$("#dp-name"); n&&n.focus(); },30);
}
function demoProviderGo(p){
  const name = ($("#dp-name").value||"").trim();
  const email = $("#dp-email") ? $("#dp-email").value.trim() : "";
  let orcid = $("#dp-orcid") ? $("#dp-orcid").value.trim() : "";
  if(p==="orcid" && orcid && !/^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$/.test(orcid)){ toast("An ORCID iD looks like 0000-0002-1825-0097."); return; }
  if(p==="orcid" && !orcid) orcid = "0000-0002-"+String(1000+Math.floor(Math.random()*8999))+"-"+String(1000+Math.floor(Math.random()*8999));
  closeModal(); startOnboard({method:p, via:p, wallet:randAddr(), name, email, orcid});
}

if(S && S.user){ UI.view="dashboard"; UI.from="dashboard"; }
if(!(S && S.user) && handleOrcidReturn()){ /* onboarding rendered */ } else render();
