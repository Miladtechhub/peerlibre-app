<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="PeerLibre: publish transparently, review fairly. AI-assisted editorial screening, validated reviewer rewards and verifiable publication records."><link rel="icon" type="image/svg+xml" href="/favicon.svg"><meta property="og:title" content="PeerLibre | Publish Transparently. Review Fairly."></head><body style="margin:0">
<title>PeerLibre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a journal office. Navy rail of roles and tools on the left, a paper-white working desk on the right; the rail becomes a top bar on phones.
   Identity: Oxford navy and seal gold, set in Libre Caslon (scholarship) and Libre Franklin (interface); mono only for proofs. */
:root{
  --bg:#F5F6F7; --surface:#FFFFFF; --surface-2:#EEF0F3; --ink:#14213A; --muted:#5B6578; --line:#E0E3E8;
  --accent:#13294B; --accent-ink:#FFFFFF; --accent-soft:#E7ECF4; --link:#1F4B8F;
  --seal:#8F6E2A; --gold:#C9A55A; --seal-soft:#F6EFDD;
  --ai:#2B6A6E; --ai-soft:#E2EEEE;
  --ok:#1E6B47; --ok-soft:#E0F0E7; --warn:#9A5512; --warn-soft:#F8ECDD; --bad:#A3281E; --bad-soft:#F8E4E1;
  --rail:#13294B; --rail-ink:#D9E0EC; --rail-mute:#8D9AB3; --rail-hi:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(20,33,58,.05),0 10px 30px rgba(20,33,58,.07);
  --f-display:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --f-body:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
  /* the login hero and the rail keep one navy look in both themes */
  --hero-bg:#13294B; --hero-fg:#EEF1F6; --hero-seal:#D7B66E;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1220; --surface:#131B2B; --surface-2:#1A2436; --ink:#E7EAF0; --muted:#9BA5B7; --line:#263247;
  --accent:#D7B66E; --accent-ink:#0C1220; --accent-soft:#2A2617; --link:#A9C0EA;
  --seal:#D7B66E; --gold:#D7B66E; --seal-soft:#2E2715;
  --ai:#6FC2C6; --ai-soft:#13302F;
  --ok:#62C493; --ok-soft:#12301F; --warn:#EFA75C; --warn-soft:#352612; --bad:#F08074; --bad-soft:#3A1916;
  --rail:#09101C; --rail-ink:#D9E0EC; --rail-mute:#7F8BA2; --rail-hi:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1220; --surface:#131B2B; --surface-2:#1A2436; --ink:#E7EAF0; --muted:#9BA5B7; --line:#263247;
  --accent:#D7B66E; --accent-ink:#0C1220; --accent-soft:#2A2617; --link:#A9C0EA;
  --seal:#D7B66E; --gold:#D7B66E; --seal-soft:#2E2715;
  --ai:#6FC2C6; --ai-soft:#13302F;
  --ok:#62C493; --ok-soft:#12301F; --warn:#EFA75C; --warn-soft:#352612; --bad:#F08074; --bad-soft:#3A1916;
  --rail:#09101C; --rail-ink:#D9E0EC; --rail-mute:#7F8BA2; --rail-hi:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:2.1rem;line-height:1.15} h2{font-size:1.55rem;line-height:1.2} h3{font-size:1.15rem;line-height:1.3}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.grid2>*,.grid3>*{min-width:0}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.92rem;transition:background .15s,border-color .15s,transform .05s;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:var(--surface)}
.btn.seal{background:var(--seal);border-color:var(--seal);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}

/* Inputs */
label.field{display:flex;flex-direction:column;gap:6px;font-size:.86rem;font-weight:500}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.95rem;font-weight:400}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-weight:400;color:var(--muted);font-size:.8rem}

/* Chips & pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ai{background:var(--ai-soft);color:var(--ai)} .pill.seal{background:var(--seal-soft);color:var(--seal)} .pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.tag{display:inline-block;padding:2px 8px;border:1px solid var(--line);border-radius:6px;font-size:.78rem;color:var(--muted)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{box-shadow:none}
.card.raised{box-shadow:var(--shadow)}
.card.ai-card{border-color:color-mix(in srgb,var(--ai) 40%,var(--line))}
.divider{height:1px;background:var(--line);margin:4px 0}

/* App shell */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 14px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand-mark{width:30px;height:30px;flex:none}
.brand-name{font-family:var(--f-display);font-size:1.35rem;font-weight:600;letter-spacing:-.01em}
.brand-name em{font-style:italic;font-weight:500;color:var(--accent)}
.nav-group{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav-label{padding:10px 10px 4px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:transparent;cursor:pointer;text-align:left;font-size:.92rem;color:var(--ink);width:100%}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn svg{width:18px;height:18px;flex:none;opacity:.85}
.nav-btn .count{margin-left:auto;font-size:.72rem;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:0 7px;font-weight:600}
.nav-btn.on .count{background:var(--surface);color:var(--accent)}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:.85rem;color:var(--surface);background:var(--accent)}
.who-txt{min-width:0}
.who-txt .n{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-txt .w{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{min-width:0;padding-inline:clamp(16px,3.5vw,44px);padding-block:22px 64px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.balance{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--seal-soft);color:var(--seal);font-weight:600;font-size:.9rem;border:0;cursor:pointer}
.balance svg{width:20px;height:20px}
.role-switch{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.role-switch button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:.82rem;font-weight:500;cursor:pointer;color:var(--muted)}
.role-switch button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.page-head{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;max-width:760px}
.page-head p{color:var(--muted)}
.section{display:flex;flex-direction:column;gap:14px;margin-top:26px}

/* Stats */
.stat .k{font-size:.8rem;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--f-body);font-size:.8rem;color:var(--muted);margin-left:4px}

/* Pipeline */
.pipe{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.pipe .st{flex:1 0 92px;display:flex;flex-direction:column;gap:6px;font-size:.74rem;color:var(--muted);position:relative;padding-right:6px}
.pipe .bar{height:5px;border-radius:3px;background:var(--surface-2)}
.pipe .st.done .bar{background:var(--accent)}
.pipe .st.now .bar{background:linear-gradient(90deg,var(--accent) 50%,var(--surface-2) 50%)}
.pipe .st.stop .bar{background:var(--bad)}
.pipe .st.done,.pipe .st.now{color:var(--ink)}

/* Manuscript list */
.ms{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:start;padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface)}
.ms:hover{background:color-mix(in srgb,var(--surface-2) 50%,var(--surface))}
.ms:first-child{border-top-left-radius:var(--r);border-top-right-radius:var(--r)}
.ms:last-child{border-bottom:0;border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r)}
.ms .t{font-family:var(--f-display);font-size:1.08rem;font-weight:500;line-height:1.3}
.ms .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

/* Login */
.auth{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.auth-hero{position:relative;padding:clamp(24px,5vw,64px);display:flex;flex-direction:column;gap:26px;justify-content:center;background:var(--hero-bg);color:var(--hero-fg);overflow:hidden}
.auth-hero .brand-mark rect{fill:var(--hero-fg)} .auth-hero .brand-mark path{stroke:var(--hero-bg)} .auth-hero .brand-name em{color:var(--hero-seal)}
.only-phone{display:none!important}
.auth-hero h1{font-size:clamp(2.2rem,4.6vw,3.6rem);line-height:1.04;font-weight:500}
.auth-hero h1 em{font-style:italic;color:var(--hero-seal)}
.auth-hero p.lead{max-width:34em;opacity:.82;font-size:1.02rem}
.auth-hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.auth-hero>*:not(canvas){position:relative}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;max-width:560px;font-size:.72rem}
.flow div{padding:10px 8px;background:rgba(255,255,255,.07);display:flex;flex-direction:column;gap:2px}
.flow div:first-child{border-radius:8px 0 0 8px}.flow div:last-child{border-radius:0 8px 8px 0}
.flow b{font-family:var(--f-display);font-size:1.3rem;font-weight:500;color:var(--hero-seal)}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:clamp(20px,4vw,56px) 16px}
.auth-card{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.login-opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left}
.login-opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.login-opt .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.login-opt .ic svg{width:20px;height:20px}
.login-opt .tx{display:flex;flex-direction:column;min-width:0}
.login-opt .tx b{font-weight:600;font-size:.94rem}
.login-opt .tx span{font-size:.8rem;color:var(--muted)}
.login-opt .go{margin-left:auto;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 12px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp input{text-align:center;font-family:var(--f-mono);font-size:1.3rem;padding:10px 0}
.demo-note{font-size:.8rem;padding:10px 12px;border-radius:8px;background:var(--seal-soft);color:var(--seal)}

/* AI editor */
.ai-head{display:flex;gap:14px;align-items:center}
.ai-badge{width:42px;height:42px;border-radius:12px;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;flex:none}
.ai-badge svg{width:24px;height:24px}
.score-ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--ai) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.score-ring>div{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1}
.score-ring b{font-family:var(--f-display);font-size:1.9rem;font-weight:500}
.score-ring span{font-size:.65rem;color:var(--muted);display:block;margin-top:2px}
.bars{display:flex;flex-direction:column;gap:9px}
.bars .b{display:grid;grid-template-columns:minmax(0,150px) 1fr 34px;gap:10px;align-items:center;font-size:.84rem}
.bars .track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bars .fill{height:100%;background:var(--ai);border-radius:4px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bars .fill.low{background:var(--warn)}
.thinking{display:flex;flex-direction:column;gap:8px}
.thinking .ln{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--muted)}
.thinking .ln.on{color:var(--ink)}
.thinking .ln.done{color:var(--ai)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--ai-soft);border-top-color:var(--ai);animation:spin .8s linear infinite;flex:none}
.tick{width:14px;height:14px;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
ul.clean{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.verdict{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:8px;font-weight:600}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.warn{background:var(--warn-soft);color:var(--warn)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}

/* Split bar (credit flow) */
.split{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px}
.split>div{display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;color:var(--surface);white-space:nowrap;overflow:hidden;transition:flex-grow .6s}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px 16px;font-size:.84rem}
.legend div{display:flex;gap:8px;align-items:baseline}
.legend i{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block;transform:translateY(1px)}

/* Drop zone */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer;background:var(--surface)}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:28px;height:28px;color:var(--accent)}

/* Stepper */
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.stepper div{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface-2)}
.stepper div b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-size:.75rem}
.stepper div.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.stepper div.on b{background:var(--accent);color:var(--accent-ink)}
.stepper div.done b{background:var(--ok);color:var(--surface)}

/* Ledger */
.ledger{width:100%;border-collapse:collapse;font-size:.84rem}
.ledger th{text-align:left;font-weight:600;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.ledger td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.ledger tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.chain-line{display:flex;flex-direction:column;gap:0;position:relative}
.ev{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:16px;position:relative}
.ev::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.ev:last-child::before{display:none}
.ev .node{width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);display:grid;place-items:center;z-index:1}
.ev .node.ai{border-color:var(--ai)} .ev .node.seal{border-color:var(--seal)} .ev .node.ok{border-color:var(--ok)} .ev .node.bad{border-color:var(--bad)}
.ev .node::after{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.ev .node{color:var(--accent)} .ev .node.ai{color:var(--ai)} .ev .node.seal{color:var(--seal)} .ev .node.ok{color:var(--ok)} .ev .node.bad{color:var(--bad)}
.hash{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);word-break:break-all}

/* Market */
.item .price{font-family:var(--f-display);font-size:1.4rem;color:var(--seal)}
.item .kind{display:flex;gap:8px;align-items:center}

/* Modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.5);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
@keyframes fade{from{opacity:0}}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;font-size:.88rem;box-shadow:var(--shadow);animation:rise .25s;display:flex;gap:10px;align-items:flex-start}
.toast .mono{color:var(--seal)}

<script>
/* ============ PeerLibre v1 prototype ============
   Everything runs in the browser. Chain events are simulated (testnet-style) and kept per viewer.
   Only hashes and event metadata are written to the "ledger"; manuscript text stays in local state. */

const STORE_KEY = "peerlibre.v1";
const FEE = 100;                       // submission fee in tPLIB credits (white paper Table 6)
const SPLIT = [                        // 100 tPLIB workflow allocation
  {k:"reviewer", label:"Reviewer reward pool", amt:60, color:"var(--seal)"},

  {k:"tech", label:"Technical workflow & storage", amt:10, color:"var(--ai)"},
  {k:"waiver", label:"Researcher inclusion (waivers)", amt:10, color:"var(--ok)"},
  {k:"treasury", label:"Community development", amt:5, color:"var(--muted)"}
];
const BASE_REWARD = 30;                // B: base reward per validated review
const SLOTS = 2;                       // reviewers per manuscript
const WELCOME = 250;

const JOURNALS = [
  {id:"jori", name:"Journal of Open Research & Integrity", short:"JORI", tier:"Q1 target",
   threshold:72, scope:"Research integrity, peer review, open science infrastructure, scholarly communication, meta-research and research evaluation.",
   bar:"Rigorous, original empirical or theoretical contribution with transparent methods, adequate sample or evidence, engagement with current literature, and clear implications for research practice."},
  {id:"dis", name:"Digital Innovation & Society Letters", short:"DISL", tier:"Q2 target",
   threshold:62, scope:"Technology adoption, blockchain and Web3 applications, AI in organisations, digital platforms, innovation management and technology policy.",
   bar:"Sound method and clear contribution; short communications and well-designed pilot studies are welcome if limitations are acknowledged."},
  {id:"acr", name:"Applied Computing Reviews", short:"ACR", tier:"Q2 target",
   threshold:65, scope:"Applied machine learning, software systems, human-computer interaction, distributed systems and their evaluation.",
   bar:"Reproducible methods, comparison with baselines, public code or data where possible, and evaluation that supports the claims."}
];

const MARKET = [
  {id:"m1", kind:"Conference", title:"Registration discount, Asia-Pacific Research Integrity Forum 2027", partner:"APRIF (pilot partner)", price:60},
  {id:"m2", kind:"Training", title:"Systematic review methods, 4-week online course", partner:"Methods Lab (pilot partner)", price:45},
  {id:"m3", kind:"Software", title:"Reference manager Pro, 12 months", partner:"Research tools vendor (pilot)", price:25},
  {id:"m4", kind:"Books", title:"Academic e-book credit, any title up to USD 40", partner:"Scholarly bookseller (pilot)", price:35},
  {id:"m5", kind:"Publishing", title:"Language editing, up to 6,000 words", partner:"Editing partner (pilot)", price:50},
  {id:"m6", kind:"Waiver", title:"Donate to the researcher waiver pool", partner:"PeerLibre inclusion fund", price:20}
];

let S = null;     // app state
let UI = {view:"dashboard", sel:null, step:1, draft:null, loginTab:"wallet", otp:null, pendingUser:null, aiBusy:{}, coach:{}, modal:null, filter:"all"};

/* ---------- utilities ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
const now = () => Date.now();
const DAY = 864e5;
const fdate = t => new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
const ftime = t => new Date(t).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const short = h => h ? h.slice(0,10)+"…"+h.slice(-6) : "";
const rid = (n=8) => Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>b.toString(16).padStart(2,"0")).join("");
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const initials = n => (n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");

async function sha256(input){
  const data = typeof input === "string" ? new TextEncoder().encode(input) : input;
  const buf = await crypto.subtle.digest("SHA-256", data);
  return "0x"+Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,"0")).join("");
}
async function saltedHash(bytesOrText, salt){
  const body = typeof bytesOrText === "string" ? new TextEncoder().encode(bytesOrText) : new Uint8Array(bytesOrText);
  const s = new TextEncoder().encode(salt);
  const all = new Uint8Array(s.length+body.length); all.set(s,0); all.set(body,s.length);
  return sha256(all);
}

function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r = localStorage.getItem(STORE_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }

/* ---------- ledger (simulated testnet) ---------- */
const EVENT_INFO = {
  AccountLinked:{c:"accent", label:"Account linked"},
  SubmissionProof:{c:"accent", label:"Submission proof"},
  FeeEscrowed:{c:"seal", label:"Fee split into pools"},
  AIScreeningLogged:{c:"ai", label:"AI Editor screening logged"},
  EditorDecision:{c:"accent", label:"Editor decision"},
  ReviewerAssigned:{c:"seal", label:"Reviewer reward reserved"},
  ReviewSubmitted:{c:"accent", label:"Review submitted"},
  ReviewValidated:{c:"ok", label:"Review validated"},
  RewardReleased:{c:"seal", label:"Reward released"},
  EscrowReturned:{c:"seal", label:"Escrow returned"},
  RevisionProof:{c:"accent", label:"Revision proof"},
  Published:{c:"ok", label:"Publication record"},
  Redeemed:{c:"seal", label:"Credits redeemed"},
  CreditsIssued:{c:"seal", label:"Credits issued"},
  ReputationAttested:{c:"ok", label:"Reputation attested"}
};
async function chain(type, msId, data={}){
  S.block += 1 + Math.floor(Math.random()*3);
  const ev = {type, msId:msId||null, at:now(), block:S.block, data};
  ev.tx = await sha256(JSON.stringify(ev)+rid(4));
  S.ledger.unshift(ev);
  return ev;
}
function credit(delta, memo, msId){
  S.credits = Math.round((S.credits + delta)*100)/100;
  S.tx.unshift({delta, memo, msId:msId||null, at:now(), bal:S.credits});
}

/* ---------- AI: Claude via the page's sample capability, heuristic fallback ---------- */
let samplePromise = null;
function getSample(){
  if(!samplePromise){
    samplePromise = (window.claude && typeof window.claude.use === "function")
      ? window.claude.use("sample").catch(()=>null) : Promise.resolve(null);
  }
  return samplePromise;
}

const AI_CRITERIA = [
  ["scope_fit","Scope fit"],["originality","Originality"],["methodological_rigor","Method rigour"],
  ["evidence_quality","Evidence & data"],["literature_engagement","Literature"],["clarity","Clarity & structure"],["ethics_transparency","Ethics & transparency"]
];

function editorPrompt(ms, j){
  const text = (ms.text||"").slice(0, 14000);
  return `You are the AI Editor of "${j.name}", a scholarly journal on the PeerLibre platform. You perform the first, advisory editorial screening of a new submission. A human editor makes every decision; your job is to give them a fair, specific, evidence-based assessment.

Journal scope: ${j.scope}
Journal quality bar (${j.tier}): ${j.bar}
Score threshold for sending to peer review: ${j.threshold}/100.

Assess the submission against the journal's quality bar. Be calibrated: most submissions are not top-tier. Do not reward length or buzzwords. If the text is too short to judge something, say so and score it conservatively. Never invent facts about the paper.

Return ONLY a JSON object with exactly these keys:
{
 "scores": {"scope_fit":0-10,"originality":0-10,"methodological_rigor":0-10,"evidence_quality":0-10,"literature_engagement":0-10,"clarity":0-10,"ethics_transparency":0-10},
 "overall": 0-100 integer,
 "tier_estimate": one of "Q1","Q2","Q3","Q4","Below indexing standard",
 "recommendation": one of "send_to_review","revise_before_review","desk_reject",
 "confidence": 0-1,
 "summary": "2-3 sentence editor-facing summary",
 "strengths": ["..."] (2-4 items),
 "concerns": ["..."] (2-5 items, specific),
 "questions_for_authors": ["..."] (2-4 items),
 "suggested_reviewer_expertise": ["..."] (2-4 short expertise tags),
 "integrity_notes": ["..."] (0-3 items: e.g. missing ethics approval, data availability, possible overclaiming; empty if none)
}

SUBMISSION
Article type: ${ms.type}
Title: ${ms.title}
Keywords: ${(ms.keywords||[]).join(", ")}
Abstract: ${ms.abstract}
Manuscript text (may be truncated):
${text || "(no full text supplied; judge from title and abstract only and lower confidence)"}`;
}

function heuristicEditor(ms, j){
  const t = ((ms.title||"")+" "+(ms.abstract||"")+" "+(ms.text||"")).toLowerCase();
  const has = w => w.some(x=>t.includes(x));
  const len = (ms.text||ms.abstract||"").split(/\s+/).length;
  const scopeWords = j.scope.toLowerCase().split(/[^a-z]+/).filter(w=>w.length>4);
  const hits = scopeWords.filter(w=>t.includes(w)).length;
  const sc = {
    scope_fit: clamp(3+hits*1.2,2,9.5),
    originality: has(["novel","first","new approach","we propose","contribution"])?6.5:5,
    methodological_rigor: (has(["method","design","sample","survey","experiment","regression","model"])?5.5:3.5)+(has(["robust","validity","reliab"])?1.5:0),
    evidence_quality: (has(["data","results","n =","n=","%","significant","table"])?5.5:3.5)+(len>2500?1:0),
    literature_engagement: has(["et al","literature","prior work","references","["])?6:3.5,
    clarity: len>150?6.5:5,
    ethics_transparency: (has(["ethic","consent","irb","approval"])?6:4)+(has(["data availability","open data","github","osf"])?1.5:0)
  };
  Object.keys(sc).forEach(k=>sc[k]=Math.round(clamp(sc[k],1,9.5)*10)/10);
  const overall = Math.round(Object.values(sc).reduce((a,b)=>a+b,0)/7*10);
  const rec = overall>=j.threshold ? "send_to_review" : overall>=j.threshold-15 ? "revise_before_review" : "desk_reject";
  return {
    scores:sc, overall, tier_estimate: overall>=78?"Q1":overall>=66?"Q2":overall>=55?"Q3":overall>=45?"Q4":"Below indexing standard",
    recommendation:rec, confidence:.35,
    summary:`Rule-based screening (the AI model was not available in this view). Scores come from keyword and structure signals, so treat them as a rough first pass only.`,
    strengths:[hits>2?"Topic overlaps clearly with the journal scope.":"Submission is complete enough to screen.", len>1500?"Full text supplied for assessment.":"Abstract is readable and structured."],
    concerns:[sc.methodological_rigor<6?"Methods are not described in enough detail to judge rigour.":"Check that the method supports the claims.", sc.ethics_transparency<6?"No ethics approval or data availability statement detected.":"Confirm data and code availability.", sc.literature_engagement<6?"Limited visible engagement with prior literature.":"Make the contribution against prior work explicit."],
    questions_for_authors:["What is the main contribution relative to the closest prior work?","Where can reviewers access the data and analysis code?"],
    suggested_reviewer_expertise:(ms.keywords||[]).slice(0,3),
    integrity_notes: sc.ethics_transparency<6?["Ethics statement not found in supplied text."]:[]
  };
}

function normalizeEditor(r, ms, j){
  const out = Object.assign(heuristicEditor(ms,j), r||{});
  out.scores = Object.assign({}, heuristicEditor(ms,j).scores, (r&&r.scores)||{});

  if(!["send_to_review","revise_before_review","desk_reject"].includes(out.recommendation)) out.recommendation="revise_before_review";

/* Review coach: checks completeness and tone. It is told never to weigh the recommendation. */
function coachPrompt(ms, f){
  return `You are the Review Quality Assistant on PeerLibre. You check whether a peer review report is complete, specific and professional, so an editor can validate it before the reviewer is rewarded.

Rules:
- Judge ONLY completeness, specificity, engagement with the manuscript, constructiveness and professional tone.
- You MUST NOT consider whether the reviewer recommends accept, revise or reject. The reward must never depend on the recommendation.
- Suggest a quality factor Q between 0.80 and 1.20 (1.00 = meets the standard).

Manuscript title: ${ms.title}
Abstract: ${ms.abstract}

REVIEW REPORT
Contribution & originality: ${f.contribution||"(empty)"}
Methodological quality: ${f.method||"(empty)"}
Evidence & results: ${f.evidence||"(empty)"}
Clarity & presentation: ${f.clarity||"(empty)"}
Ethical issues: ${f.ethics||"(empty)"}
Required revisions: ${f.revisions||"(empty)"}
Confidential note to editor: ${f.confidential||"(empty)"}

Return ONLY JSON:
{"completeness":0-100,"sections":{"contribution":"strong|adequate|thin|missing","method":"...","evidence":"...","clarity":"...","ethics":"...","revisions":"..."},"specificity":"high|medium|low","tone_flags":["..."],"suggestions":["..."] (1-4 concrete ways to improve the report),"suggested_Q":0.80-1.20,"rationale":"one sentence"}`;
}
function heuristicCoach(f){
  const keys = ["contribution","method","evidence","clarity","ethics","revisions"];
  const sections = {}; let total=0;
  keys.forEach(k=>{ const w=(f[k]||"").trim().split(/\s+/).filter(Boolean).length; total+=w;
    sections[k] = w===0?"missing":w<15?"thin":w<45?"adequate":"strong"; });
  const missing = keys.filter(k=>sections[k]==="missing").length, thin = keys.filter(k=>sections[k]==="thin").length;
  const completeness = clamp(Math.round(100 - missing*16 - thin*7 + Math.min(10,total/40)),5,100);
  const tone = /(stupid|nonsense|garbage|idiot|worthless|lazy)/i.test(Object.values(f).join(" ")) ? ["Wording may read as dismissive; keep critique about the work."] : [];
  const q = clamp(0.8 + (completeness/100)*0.4 - (tone.length?0.1:0), .8, 1.2);
  return {completeness, sections, specificity: total>250?"high":total>110?"medium":"low", tone_flags:tone,
    suggestions: keys.filter(k=>sections[k]==="missing"||sections[k]==="thin").slice(0,3).map(k=>`Expand the ${k} section with specific points tied to sections, tables or claims in the manuscript.`).concat(total<110?["Reference specific pages, figures or analyses so the author can act on each point."]:[]),
    suggested_Q: Math.round(q*100)/100, rationale:"Rule-based check of section length and coverage (AI model unavailable in this view)."};
}
async function runCoach(ms, f){
  const sample = await getSample();
  if(sample){
    try{
      const r = await sample.json(coachPrompt(ms,f), {modelTier:"quick"});
      const h = heuristicCoach(f);
      const out = Object.assign(h, r||{});
      out.suggested_Q = Math.round(clamp(Number(out.suggested_Q)||1,.8,1.2)*100)/100;
      out.completeness = clamp(Math.round(Number(out.completeness)||0),0,100);
      if(!Array.isArray(out.suggestions)) out.suggestions=[]; if(!Array.isArray(out.tone_flags)) out.tone_flags=[];
      out.source="claude"; return out;
    }catch(e){ /* fall through */ }
  }
  await new Promise(r=>setTimeout(r,700));
  return Object.assign(heuristicCoach(f),{source:"heuristic"});
}

/* Reward formula from the white paper: R = B × Q × T × C */
function timeliness(rv){
  if(!rv.submittedAt) return 1;
  const days = (rv.submittedAt - rv.acceptedAt)/DAY, allowed = (rv.dueAt - rv.acceptedAt)/DAY;
  const r = days/allowed;
  return Math.round(clamp(1.10 - r*0.2, .9, 1.1)*100)/100;
}
function reward(B,Q,T,C){ return Math.round(B*Q*T*C*100)/100; }

/* Integrity flags for human attention (never automatic sanctions) */
function integrityFlags(ms, rv){
  const flags=[];
  const mins = rv.submittedAt && rv.acceptedAt ? (rv.submittedAt-rv.acceptedAt)/6e4 : null;
  const words = Object.values(rv.form||{}).join(" ").split(/\s+/).filter(Boolean).length;
  if(mins!==null && mins<20 && words>0) flags.push("Report submitted within "+Math.max(1,Math.round(mins))+" minutes of accepting. Check depth of engagement.");
  const others = (ms.reviews||[]).filter(o=>o!==rv && o.form);
  others.forEach(o=>{ const a=new Set((o.form.method||"").toLowerCase().split(/\W+/).filter(w=>w.length>5)), b=(rv.form.method||"").toLowerCase().split(/\W+/).filter(w=>w.length>5);
    const ov=b.filter(w=>a.has(w)).length; if(b.length>8 && ov/b.length>.7) flags.push("High text overlap with another report on this manuscript."); });
  if(S.user && rv.reviewerId===S.user.id && ms.authorId===S.user.id) flags.push("Reviewer is the author.");
  if(S.user && rv.reviewerId===S.user.id && S.user.activeRole==="editor") flags.push("You are validating your own review. In a live journal another editor would do this.");
  return flags;
}

  await chain("ReviewSubmitted", b.id, {reviewer:"R-17", reportHash:await sha256(JSON.stringify(b.reviews[0].form))});
  await chain("Published", "PL-2026-0118", {cid:S.manuscripts[2].cid});
  S.ledger.forEach((e,i)=>{ e.at = t0 - (i+1)*DAY*0.7; });
  // the user
  await chain("AccountLinked", null, {method:user.method, wallet:user.wallet, embedded:user.method!=="wallet"});
  credit(WELCOME, "Welcome test credits (tPLIB, no monetary value)");
  await chain("CreditsIssued", null, {to:user.wallet, amount:WELCOME});
  save();
}

  revision_requested:{t:"Revision requested", c:"warn"}, revised:{t:"Revised, awaiting decision", c:"accent"},
  published:{t:"Published", c:"ok"}, desk_rejected:{t:"Desk rejected", c:"bad"}, rejected:{t:"Rejected", c:"bad"}, pre_revise:{t:"Revise before review", c:"warn"}
};
const REC = {send_to_review:{t:"Send to peer review", c:"ok"}, revise_before_review:{t:"Revise before review", c:"warn"}, desk_reject:{t:"Desk reject", c:"bad"}};
const RECO = {accept:"Accept", minor:"Minor revision", major:"Major revision", reject:"Reject"};
const pill = (t,c="") => `<span class="pill ${c}"><span class="dot"></span>${esc(t)}</span>`;
const statusPill = s => pill((STATUS[s]||{t:s}).t, (STATUS[s]||{}).c);
const journal = id => JOURNALS.find(j=>j.id===id);
const msById = id => S.manuscripts.find(m=>m.id===id);

const isMine = ms => ms.authorId===S.user.id;
const openSlots = ms => ms.slots - ms.reviews.filter(r=>r.status!=="withdrawn").length;

function pipeline(ms){
  const stages = [["Submitted","screening"],["AI screened","editor_check"],["Editor check","editor_check"],["Peer review","in_review"],["Decision","revision_requested"],["Published","published"]];
  const order = {screening:0, editor_check:2, pre_revise:2, in_review:3, revision_requested:4, revised:4, published:6, desk_rejected:2, rejected:4};
  const pos = order[ms.status] ?? 0, stop = ["desk_rejected","rejected"].includes(ms.status);
  return `<div class="pipe" aria-label="Workflow progress">${stages.map((s,i)=>{
    let cls = i<pos ? "done" : i===pos ? (stop?"stop":"now") : "";
    if(ms.status==="published") cls="done";
    if(stop && i>pos) cls="";
    return `<div class="st ${cls}"><div class="bar"></div><span>${s[0]}</span></div>`;}).join("")}</div>`;
}

function scoreRing(v,label="of 100"){ return `<div class="score-ring" style="--p:${v}"><div><div><b class="num">${v}</b><span>${label}</span></div></div></div>`; }

const THINK = ["Reading title, abstract and keywords","Checking fit with the journal scope","Assessing method and evidence against the quality bar","Looking for ethics and integrity signals","Writing the brief for the handling editor"];
function aiThinking(ms){

function splitBar(scale=1){
  return `<div class="split">${SPLIT.map(s=>`<div style="flex:${s.amt};background:${s.color}" title="${esc(s.label)}">${s.amt*scale>=10?s.amt*scale:""}</div>`).join("")}</div>

}

function evRow(e, withMs=true){
  const info = EVENT_INFO[e.type]||{c:"accent",label:e.type};
  const d = e.data||{};
  const parts=[];
  if(d.versionHash) parts.push(`fingerprint <span class="hash">${short(d.versionHash)}</span>`);
  if(d.amount!==undefined) parts.push(`${fmt(d.amount)} tPLIB`);
  if(d.reserved) parts.push(`${d.reserved} tPLIB reserved`);
  if(d.R!==undefined) parts.push(`R = ${fmt(d.R)} tPLIB`);
  if(d.overall!==undefined) parts.push(`score ${d.overall}, ${REC[d.rec]?REC[d.rec].t.toLowerCase():d.rec}`);
  if(d.action) parts.push(`${esc(d.action.replace(/_/g," "))}${d.agreesWithAI===false?" · overrode AI":d.agreesWithAI?" · agreed with AI":""}`);
  if(d.reviewer) parts.push(`reviewer ${esc(d.reviewer)}`);
  if(d.cid) parts.push(`IPFS <span class="hash">${short(d.cid)}</span>`);
  if(d.item) parts.push(esc(d.item));
  if(d.method) parts.push(`${esc(d.method)} sign-in${d.embedded?", embedded wallet":""}`);
  return {info, parts:parts.join(" · ")};
}

function matchScore(m){
  const exp = (S.user.expertise||[]).map(x=>x.toLowerCase());
  const kws = [...(m.keywords||[]), ...((m.ai&&m.ai.suggested_reviewer_expertise)||[])].map(x=>x.toLowerCase());
  let hit=0; exp.forEach(e=>{ if(kws.some(k=>k.includes(e)||e.includes(k)||e.split(" ").some(w=>w.length>4&&k.includes(w)))) hit++; });
  return clamp(Math.round(45 + hit*18 + (m.journalId==="jori"?6:0)), 30, 98);
}
function poolRow(m, compact){
  const j = journal(m.journalId), mine = isMine(m), ms = matchScore(m);
  return `<div class="ms" style="cursor:default">
    <div class="stack" style="gap:8px;min-width:0"><div class="t">${esc(m.title)}</div>
      <div class="meta"><span class="mono">${m.id}</span><span>${esc(j.short)}</span><span>${esc(m.type)}</span><span>Author identity hidden</span></div>
      ${compact?"":`<p class="small muted">${esc(m.abstract)}</p>`}
      <div class="row">${m.keywords.map(k=>`<span class="tag">${esc(k)}</span>`).join("")}</div></div>
    <div class="stack" style="gap:8px;align-items:flex-end;text-align:right">
      <span class="pill seal">${BASE_REWARD} to ${fmt(reward(BASE_REWARD,1.2,1.1,1))} tPLIB</span>
      <span class="pill accent">${ms}% expertise match</span>
      <span class="small muted">${openSlots(m)} of ${m.slots} slots open · 14 days</span>
      ${mine?`<span class="pill bad">Conflict: you are the author</span>`:`<button class="btn primary" data-act="acceptReview" data-id="${m.id}">Accept and reserve ${BASE_REWARD} tPLIB</button>`}
    </div></div>`;
}

/* ---------- SUBMIT ---------- */
function newDraft(){ return {journalId:"jori", type:"Research article", title:"", abstract:"", keywords:"", text:"", fileName:"", fileSize:0, fileBytes:null, decl1:false, decl2:false, decl3:false}; }
function viewSubmit(){
  const d = UI.draft || (UI.draft = newDraft());
  const st = UI.step;
  const steps = ["Manuscript","Fee & proof","AI Editor"];
  const stepper = `<div class="stepper">${steps.map((s,i)=>`<div class="${i+1===st?"on":i+1<st?"done":""}"><b>${i+1<st?"✓":i+1}</b>${s}</div>`).join("")}</div>`;
  const head = `<div class="page-head"><span class="eyebrow">New submission</span><h1>Submit a manuscript</h1><p>Pay ${FEE} credits, get a timestamped proof of your exact version, and an AI Editor reading in about a minute. A human editor decides what happens next.</p></div>`;
  if(st===1){
    const j = journal(d.journalId);
    return head+stepper+`<div class="grid2" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)">
    <div class="card stack">
      <div class="spread"><h3>Manuscript details</h3><button class="btn ghost small" data-act="loadExample">${I.doc} Fill with an example</button></div>
      <label class="field">Journal<select class="input" id="d-journal" data-bind="draft.journalId">${JOURNALS.map(x=>`<option value="${x.id}" ${x.id===d.journalId?"selected":""}>${esc(x.name)} (${x.tier})</option>`).join("")}</select></label>
      <label class="field">Article type<select class="input" id="d-type" data-bind="draft.type">${["Research article","Short communication","Review article","Perspective","Software paper"].map(t=>`<option ${t===d.type?"selected":""}>${t}</option>`).join("")}</select></label>
      <label class="field">Title<input class="input" id="d-title" data-bind="draft.title" value="${esc(d.title)}" placeholder="A clear, specific title"></label>
      <label class="field">Abstract<textarea class="input" id="d-abstract" data-bind="draft.abstract" rows="5" placeholder="150 to 300 words">${esc(d.abstract)}</textarea></label>
      <label class="field">Keywords <span class="hint">Comma separated</span><input class="input" id="d-kw" data-bind="draft.keywords" value="${esc(d.keywords)}" placeholder="peer review, incentives, open science"></label>
      <div class="field" style="font-size:.86rem;font-weight:500">Manuscript file</div>
      <label class="drop" id="drop" for="d-file">${I.upload}<b>${d.fileName?esc(d.fileName):"Drop your PDF, DOCX or TXT here"}</b><span class="small muted">${d.fileName?`${fmt(d.fileSize/1024)} KB · ${d.text?d.text.split(/\s+/).length.toLocaleString()+" words extracted for the AI Editor":"text could not be extracted; the AI Editor will use the abstract"}`:"or click to choose a file. Encrypted at rest; only its fingerprint goes on chain."}</span></label>
      <input type="file" id="d-file" accept=".pdf,.docx,.txt,.md" hidden>
      <details><summary class="small" style="cursor:pointer;color:var(--accent)">Or paste the main text</summary><textarea class="input" id="d-text" data-bind="draft.text" rows="6" style="margin-top:8px" placeholder="Paste the body of the manuscript">${esc(d.text)}</textarea></details>
      <div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="toStep2">Continue ${I.arrow}</button></div>
    </div>
    <div class="stack">
      <div class="card stack"><span class="eyebrow">${esc(j.short)} · ${esc(j.tier)}</span><h3>${esc(j.name)}</h3><p class="small"><b>Scope.</b> ${esc(j.scope)}</p><p class="small"><b>Quality bar.</b> ${esc(j.bar)}</p><p class="small muted">The AI Editor sends papers scoring ${j.threshold} or more straight to the handling editor with a "send to review" recommendation.</p></div>
      <div class="callout">${I.lock}<span>Your file stays encrypted off chain. The ledger only records a salted fingerprint, the version number and the time.</span></div>
    </div></div>`;
  }
  if(st===2){
    const enough = S.credits >= FEE;
    return head+stepper+`<div class="grid2" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)">
    <div class="card stack">
      <h3>Pay the submission fee</h3>
      <div class="spread"><span>Submission fee</span><b class="num" style="font-family:var(--f-display);font-size:1.5rem">${FEE} tPLIB</b></div>
      <div class="spread small muted"><span>Your balance after payment</span><span class="num">${fmt(S.credits-FEE)} tPLIB</span></div>
      ${splitBar()}
      <div class="callout seal">${I.coin}<span>If the editor desk-rejects your paper, the ${SPLIT[0].amt} credits reserved for reviewers come back to you. Unused reviewer reserves return to the pool.</span></div>
      <div class="divider"></div>
      <label class="check"><input type="checkbox" id="decl1" data-bind="draft.decl1" ${d.decl1?"checked":""}><span>This is original work and is not under review elsewhere.</span></label>
      <label class="check"><input type="checkbox" id="decl2" data-bind="draft.decl2" ${d.decl2?"checked":""}><span>I agree that an AI Editor gives an advisory first assessment, which is shared with me and the handling editor.</span></label>
      <label class="check"><input type="checkbox" id="decl3" data-bind="draft.decl3" ${d.decl3?"checked":""}><span>All authors approved this submission and conflicts of interest are declared.</span></label>
      ${enough?"":`<div class="callout warn">${I.info}<span>You need ${fmt(FEE-S.credits)} more credits. Apply for a waiver or add sponsored credits from Credits & wallet.</span></div>`}
      <div class="spread"><button class="btn ghost" data-act="step" data-s="1">Back</button>
        ${enough?`<button class="btn seal" data-act="pay">${I.coin} Pay ${FEE} tPLIB and submit</button>`:`<button class="btn primary" data-act="getCredits">${I.coin} Get credits</button>`}</div>
    </div>
    <div class="card stack"><span class="eyebrow">What goes on chain</span>
      <div class="kv small"><dt>Recorded</dt><dd>Salted SHA-256 fingerprint, manuscript ID, version, time, fee split, AI screening summary score, editor decisions, reward releases</dd>
      <dt>Never recorded</dt><dd>Manuscript text, review reports, reviewer identities, personal data</dd></div>
      <div class="divider"></div>
      <span class="eyebrow">Your submission</span>
      <p style="font-family:var(--f-display);font-size:1.1rem">${esc(d.title)}</p>
      <p class="small muted">${esc(journal(d.journalId).name)} · ${esc(d.type)}${d.fileName?` · ${esc(d.fileName)}`:""}</p>
    </div></div>`;
  }
  // step 3
  const ms = msById(UI.sel);
  return head+stepper+`<div class="grid2" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)">
    <div>${aiReportCard(ms)}</div>
    <div class="stack">
      <div class="card stack"><span class="eyebrow">Submission recorded</span><h3 class="mono" style="font-family:var(--f-mono);font-size:1rem">${ms.id}</h3>
        <div class="kv small"><dt>Fingerprint</dt><dd class="hash">${ms.versions[0].hash}</dd><dt>Time</dt><dd>${ftime(ms.versions[0].at)}</dd><dt>Paid</dt><dd>${FEE} tPLIB, split into five pools</dd></div></div>
      ${ms.ai?`<div class="card stack"><span class="eyebrow">What happens next</span><p class="small">The handling editor reads the AI assessment and decides whether to send your paper to reviewers. You'll see their decision and reason here.</p><button class="btn primary" data-act="open" data-id="${ms.id}">Open manuscript ${I.arrow}</button></div>`:""}
    </div></div>`;
}

/* ---------- MANUSCRIPT DETAIL ---------- */
function viewDetail(){
  const ms = msById(UI.sel); if(!ms) return `<div class="empty">Manuscript not found.</div>`;
  const j = journal(ms.journalId), r = role(), mine = isMine(ms);
  const evs = S.ledger.filter(e=>e.msId===ms.id).slice().reverse();
  const canSeeReviews = r==="editor" || (mine && true);
  const reviews = ms.reviews.filter(rv => r==="editor" || rv.reviewerId===S.user.id || (mine && rv.status==="validated"));
  return `<button class="btn ghost small" data-act="go" data-v="${UI.from||"dashboard"}" style="margin-bottom:10px">← Back</button>
  <div class="page-head" style="max-width:900px"><div class="row"><span class="mono muted">${ms.id}</span>${statusPill(ms.status)}${ms.example?pill("Example record"):""}${mine?pill("You are the author","accent"):""}</div>
    <h1>${esc(ms.title)}</h1><p>${esc(j.name)} · ${esc(ms.type)} · submitted ${fdate(ms.createdAt)}</p></div>
  <div class="card" style="margin-bottom:18px">${pipeline(ms)}</div>
  <div class="grid2" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start">
    <div class="stack" style="gap:16px">
      ${editorPanel(ms)}
      ${authorPanel(ms)}
      ${aiReportCard(ms)}
      <div class="card stack"><span class="eyebrow">Abstract</span><p>${esc(ms.abstract)}</p><div class="row">${ms.keywords.map(k=>`<span class="tag">${esc(k)}</span>`).join("")}</div></div>
      ${reviews.length||canSeeReviews?`<div class="stack"><h2>Reviews</h2>${reviews.length?reviews.map(rv=>reviewCard(ms,rv)).join(""):`<div class="empty">${ms.status==="in_review"?(mine?"Validated reviews appear here once the editor approves them.":"No reviews yet."):"No reviews for this manuscript."}</div>`}</div>`:""}
    </div>
    <div class="stack" style="gap:16px">
      ${ms.editorDecision?`<div class="card stack"><span class="eyebrow">Editor's screening decision</span><b>${esc(REC[ms.editorDecision.action]?REC[ms.editorDecision.action].t:ms.editorDecision.action)}</b>
        ${ms.editorDecision.agreesWithAI?pill("Agreed with AI Editor","ok"):pill("Overrode AI Editor","warn")}
        ${ms.editorDecision.note?`<p class="small">“${esc(ms.editorDecision.note)}”</p>`:""}<p class="small muted">${esc(ms.editorDecision.by||"Handling editor")} · ${ftime(ms.editorDecision.at)}</p></div>`:""}
      ${ms.finalDecision?`<div class="card stack"><span class="eyebrow">Decision</span><b>${esc(RECO[ms.finalDecision.action]||ms.finalDecision.action)}</b>${ms.finalDecision.note?`<p class="small">“${esc(ms.finalDecision.note)}”</p>`:""}${ms.cid?`<div class="kv small"><dt>Public copy</dt><dd class="hash">ipfs://${ms.cid}</dd></div>`:""}</div>`:""}
      <div class="card stack"><span class="eyebrow">Reviewer reward escrow</span>
        <div class="spread"><span class="small">Unreserved for this paper</span><b class="num">${fmt(ms.escrow)} tPLIB</b></div>
        <div class="spread"><span class="small">Reserved for reviewers</span><b class="num">${fmt(ms.reviews.filter(x=>["accepted","submitted"].includes(x.status)).length*BASE_REWARD)} tPLIB</b></div>
        <div class="spread"><span class="small">Released after validation</span><b class="num">${fmt(ms.reviews.filter(x=>x.status==="validated").reduce((a,x)=>a+(x.reward||0),0))} tPLIB</b></div></div>
      <div class="card stack"><span class="eyebrow">Versions</span>${ms.versions.map(v=>`<div class="stack" style="gap:2px"><b class="small">Version ${v.v} · ${esc(v.fileName)}</b><span class="hash">${v.hash}</span><span class="small muted">${ftime(v.at)}</span></div>`).join("")}
        ${mine?`<p class="small muted">Your private salt for v${ms.versions.length}: <span class="mono">${ms.versions[ms.versions.length-1].salt.slice(0,12)}…</span> Keep it to prove this exact version later.</p>`:""}</div>
      <div class="card stack"><span class="eyebrow">Provenance trail</span><div class="chain-line">${evs.map(e=>{const {info,parts}=evRow(e);return `<div class="ev"><div class="node ${info.c}"></div><div class="stack" style="gap:2px;min-width:0"><b class="small">${info.label}</b><span class="small muted">${parts}</span><span class="hash">#${e.block.toLocaleString()} · ${short(e.tx)} · ${ftime(e.at)}</span></div></div>`}).join("")}</div></div>
    </div>
  </div>`;
}

function editorPanel(ms){
  if(role()!=="editor") return "";
  const ai = ms.ai; const mine = isMine(ms);
  const coi = mine?`<div class="callout warn">${I.info}<span>You are the author of this paper. In a live journal it would be routed to another editor. The prototype lets you continue so you can try the full workflow.</span></div>`:"";
  if(["editor_check","pre_revise"].includes(ms.status) && ai){
    const pick = UI.edPick && UI.edPick.id===ms.id ? UI.edPick.a : null;
    const agrees = pick ? pick===ai.recommendation : null;
    return `<div class="card raised stack" style="border-color:var(--accent)"><div class="spread"><h3>Your screening decision</h3>${pill("Handling editor","accent")}</div>${coi}
      <p class="small">The AI Editor recommends <b>${REC[ai.recommendation].t.toLowerCase()}</b> with a score of ${ai.overall}. You decide.</p>
      <div class="row">${Object.entries(REC).map(([k,v])=>`<button class="btn ${pick===k?"primary":""}" data-act="edPick" data-id="${ms.id}" data-a="${k}">${v.t}</button>`).join("")}</div>
      ${pick?`${agrees?pill("Agrees with the AI Editor","ok"):pill("Overrides the AI Editor, a reason is required","warn")}
      <label class="field">Note to author ${agrees?'<span class="hint">Optional</span>':'<span class="hint">Required when overriding. Logged for the human-AI agreement record.</span>'}<textarea class="input" id="ed-note" rows="3" placeholder="${pick==="send_to_review"?"Brief instructions for reviewers or the author":"Reason for your decision"}"></textarea></label>
      <div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="edDecide" data-id="${ms.id}">Record decision</button></div>`:""}
    </div>`;
  }
  if(ms.status==="in_review"){
    const subs = ms.reviews.filter(x=>x.status==="submitted");
    const val = ms.reviews.filter(x=>x.status==="validated").length;
    const open = openSlots(ms);
    return `<div class="card raised stack" style="border-color:var(--accent)"><div class="spread"><h3>Peer review in progress</h3>${pill(`${val} of ${ms.slots} reviews validated`,"accent")}</div>${coi}
      ${subs.length?`<p class="small">${subs.length} report${subs.length>1?"s":""} waiting for your validation below.</p>`:""}
      ${open>0?`<div class="callout">${I.review}<span>${open} reviewer slot${open>1?"s are":" is"} open in the review pool. ${mine?"Because you are the author you can't review it yourself; ":""}For the demo you can invite a simulated pilot reviewer.</span></div><div><button class="btn" data-act="simReviewer" data-id="${ms.id}">Invite a simulated reviewer</button></div>`:""}
      ${val>=1 && !subs.length && ms.reviews.every(x=>x.status!=="accepted") ? finalDecisionBlock(ms):""}
    </div>`;
  }
  if(ms.status==="revised") return `<div class="card raised stack" style="border-color:var(--accent)"><h3>Revised version received</h3>${coi}<p class="small">Version ${ms.versions.length} was submitted with a new fingerprint. Make the final decision.</p>${finalDecisionBlock(ms,true)}</div>`;
  return "";
}
function finalDecisionBlock(ms, revised){
  const opts = revised ? ["accept","reject"] : ["accept","minor","major","reject"];
  return `<div class="stack"><span class="eyebrow">Editorial decision</span><div class="row">${opts.map(o=>`<button class="btn ${o==="accept"?"primary":o==="reject"?"danger":""}" data-act="final" data-id="${ms.id}" data-a="${o}">${RECO[o]}</button>`).join("")}</div>
    <label class="field">Decision letter<textarea class="input" id="final-note" rows="2" placeholder="Summary for the author"></textarea></label></div>`;
}
function authorPanel(ms){
  if(!isMine(ms) || role()!=="author") return "";
  if(ms.status==="revision_requested" || ms.status==="pre_revise"){
    return `<div class="card raised stack" style="border-color:var(--warn)"><h3>Upload your revised manuscript</h3><p class="small">The revision gets its own fingerprint and version record. ${ms.status==="pre_revise"?"It goes back to the editor before review.":"It goes back to the editor for a decision."}</p>
      <label class="drop" for="rev-file">${I.upload}<b>${UI.revFile&&UI.revFile.id===ms.id?esc(UI.revFile.name):"Choose revised file"}</b><span class="small muted">PDF, DOCX or TXT</span></label><input type="file" id="rev-file" data-id="${ms.id}" hidden>
      <label class="field">Response to reviewers<textarea class="input" id="rev-note" rows="3" placeholder="How you addressed each point"></textarea></label>
      <div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="submitRevision" data-id="${ms.id}">Submit revision</button></div></div>`;
  }
  if(ms.status==="editor_check") return `<div class="callout">${I.info}<span>Waiting for the handling editor. ${S.user.roles.includes("editor")?"Switch to Editor at the top to try the editor's side.":""}</span></div>`;
  return "";
}

function reviewCard(ms, rv){
  const r = role(), f = rv.form||{};
  const isEd = r==="editor";
  const flags = rv.status!=="accepted" ? integrityFlags(ms, rv) : [];
  const recPill = rv.recommendation ? pill(RECO[rv.recommendation],"") : "";
  let body = "";
  if(rv.status==="accepted") body = `<p class="small muted">Accepted ${ftime(rv.acceptedAt)} · due ${fdate(rv.dueAt)} · ${BASE_REWARD} tPLIB reserved</p>${rv.reviewerId===S.user.id?`<div><button class="btn primary" data-act="writeReview" data-id="${ms.id}">Write review</button></div>`:""}`;
  else body = `<div class="stack small">${[["contribution","Contribution & originality"],["method","Methodological quality"],["evidence","Evidence & results"],["clarity","Clarity"],["ethics","Ethics"],["revisions","Required revisions"]].map(([k,l])=>f[k]?`<div><b>${l}.</b> ${esc(f[k])}</div>`:"").join("")}${isEd&&f.confidential?`<div class="callout">${I.lock}<span><b>Confidential to editor.</b> ${esc(f.confidential)}</span></div>`:""}</div>`;
  let validate = "";
  if(isEd && rv.status==="submitted"){
    const q = (UI.qv[rv.id] ?? (rv.coach?rv.coach.suggested_Q:1)), T = timeliness(rv), C = UI.cv[rv.id]===false?0:1, R = reward(BASE_REWARD,q,T,C);
    validate = `<div class="divider"></div><div class="stack">
      <div class="spread"><h3>Validate and release reward</h3>${rv.coach?pill(`Quality check ${rv.coach.completeness}% complete`,"ai"):""}</div>
      ${rv.coach?`<div class="callout ai">${I.ai}<span>${esc(rv.coach.rationale||"")} Suggested Q = ${fmt(rv.coach.suggested_Q)}. The quality check never looks at the recommendation.</span></div>`:""}
      ${flags.length?`<div class="callout warn">${I.info}<span><b>Flags for your attention.</b> ${flags.map(esc).join(" ")} Flags inform your judgement; they are not findings of misconduct.</span></div>`:""}
      <div class="slider-row"><span>Quality Q</span><input type="range" min="0.8" max="1.2" step="0.01" value="${q}" data-act="qv" data-id="${rv.id}" id="q-${rv.id}" aria-label="Quality factor"><b class="num mono">${fmt(q)}</b></div>
      <div class="slider-row"><span>Timeliness T</span><span class="small muted">${Math.round((rv.submittedAt-rv.acceptedAt)/DAY*10)/10} of 14 days used</span><b class="num mono">${fmt(T)}</b></div>
      <label class="check"><input type="checkbox" id="c-${rv.id}" data-act="cv" data-id="${rv.id}" ${C?"checked":""}><span>Integrity C: no confidentiality breach or undeclared conflict</span></label>
      <div class="formula">R = ${BASE_REWARD} × ${fmt(q)} × ${fmt(T)} × ${C} = <b>${fmt(R)} tPLIB</b></div>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-act="returnReview" data-id="${ms.id}" data-r="${rv.id}">Return for improvement</button><button class="btn seal" data-act="validate" data-id="${ms.id}" data-r="${rv.id}">${I.check} Validate and release</button></div>
    </div>`;
  }
  return `<div class="card stack"><div class="spread"><div class="row"><b>${esc(rv.reviewerId===S.user.id?"Your review":rv.alias)}</b>${recPill}</div>
    ${rv.status==="validated"?pill(`Validated · ${fmt(rv.reward)} tPLIB released`,"ok"):rv.status==="submitted"?pill("Awaiting validation","seal"):pill("In progress","")}</div>
    ${body}${validate}</div>`;
}

/* ---------- REVIEW POOL & FORM ---------- */
function viewPool(){
  const mineRv = S.manuscripts.flatMap(m=>m.reviews.filter(r=>r.reviewerId===S.user.id).map(r=>({m,r})));
  const pool = S.manuscripts.filter(m=>m.status==="in_review" && openSlots(m)>0 && !m.reviews.some(r=>r.reviewerId===S.user.id))
    .sort((a,b)=>matchScore(b)-matchScore(a));
  return `<div class="page-head"><span class="eyebrow">Reviewer</span><h1>Review pool</h1><p>Open review requests, sorted by how well they match your expertise. Author identities are hidden. Accepting reserves the base reward in escrow; it's released after an editor validates your report.</p></div>
  <div class="card stack" style="margin-bottom:18px"><div class="spread"><span class="eyebrow">Your reward</span><span class="small muted">Recommendation has no effect on payment</span></div>
    <div class="formula">R = B × Q × T × C</div>
    <div class="grid3 small"><div><b>B</b> base reward: ${BASE_REWARD} tPLIB</div><div><b>Q</b> report quality: 0.80 to 1.20</div><div><b>T</b> timeliness: 0.90 to 1.10</div><div><b>C</b> integrity: 1, or 0 for a serious breach</div></div></div>
  ${mineRv.length?`<div class="section" style="margin-top:0"><h2>Your assignments</h2><div class="list">${mineRv.map(({m,r})=>`<div class="ms" data-act="${r.status==="accepted"?"writeReview":"open"}" data-id="${m.id}" role="button" tabindex="0"><div class="stack" style="gap:6px;min-width:0"><div class="t">${esc(m.title)}</div><div class="meta"><span class="mono">${m.id}</span><span>${r.status==="accepted"?"Due "+fdate(r.dueAt):"Submitted "+fdate(r.submittedAt)}</span></div></div><div>${r.status==="validated"?pill(`${fmt(r.reward)} tPLIB earned`,"ok"):r.status==="submitted"?pill("Awaiting validation","seal"):pill("Write review","accent")}</div></div>`).join("")}</div></div>`:""}
  <div class="section"><h2>Open requests</h2><div class="list">${pool.map(m=>poolRow(m,false)).join("") || `<div class="empty">No open requests right now. Check back later.</div>`}</div></div>`;
}
function viewReviewForm(){
  const ms = msById(UI.sel), rv = ms.reviews.find(r=>r.reviewerId===S.user.id);
  const f = UI.rform[ms.id] || (UI.rform[ms.id] = {contribution:"",method:"",evidence:"",clarity:"",ethics:"",revisions:"",confidential:"",recommendation:""});
  const c = UI.coach[ms.id];
  const fld = (k,l,h) => `<label class="field">${l} <span class="hint">${h}</span><textarea class="input" id="rf-${k}" data-bind="rform.${ms.id}.${k}" rows="3">${esc(f[k])}</textarea></label>`;

function viewDesk(){

  return `<div class="page-head"><span class="eyebrow">Editor</span><h1>Editor desk</h1><p>The AI Editor screens each submission first. You make every decision, validate reviews before rewards are released, and each choice is logged next to the AI's recommendation.</p></div>

/* ---------- toasts ---------- */
function toast(msg){
  let box = document.querySelector(".toasts"); if(!box){ box=document.createElement("div"); box.className="toasts"; document.body.appendChild(box); }
  const t = document.createElement("div"); t.className="toast"; t.innerHTML = `<span>${msg}</span>`; box.appendChild(t);
  setTimeout(()=>t.remove(), 4000); while(box.children.length>3) box.firstChild.remove();
}
function burst(text, el){
  const r = el ? el.getBoundingClientRect() : {left:innerWidth/2, top:innerHeight/2, width:0};
  const b = document.createElement("div"); b.className="coin-burst"; b.textContent=text;
  b.style.left=(r.left+r.width/2-30)+"px"; b.style.top=(r.top-10)+"px"; document.body.appendChild(b); setTimeout(()=>b.remove(),1300);
}

const randAddr = () => "0x"+rid(20);
function startOnboard(p){ UI.pendingUser = Object.assign({roles:["author","reviewer","editor"]}, p); UI.otp=null; render(); }
async function walletBrowser(){
  const eth = window.ethereum;
  if(!eth){ modal(`<h3>No browser wallet found here</h3><p class="small muted">This preview runs inside a sandboxed frame, where wallet extensions such as MetaMask usually can't connect. On the deployed site the same button opens your wallet and asks you to sign a sign-in message (no gas, no transaction).</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary" data-act="walletTest">Use a test wallet instead</button></div>`); return; }
  try{
    const [addr] = await eth.request({method:"eth_requestAccounts"});
    const nonce = rid(8);
    const msg = `peerlibre.com wants you to sign in with your Ethereum account:\n${addr}\n\nSign in to PeerLibre. This request will not trigger a blockchain transaction or cost any gas.\n\nNonce: ${nonce}\nIssued At: ${new Date().toISOString()}`;
    await eth.request({method:"personal_sign", params:[msg, addr]});
    startOnboard({method:"wallet", via:"wallet", wallet:addr});
  }catch(e){ toast("Wallet sign-in was cancelled."); }
}

/* ---------- file reading ---------- */
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function extractText(file, bytes){
  const n = file.name.toLowerCase();
  try{
    if(n.endsWith(".txt")||n.endsWith(".md")) return new TextDecoder().decode(bytes);
    if(n.endsWith(".pdf")){
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
      const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      const pdf = await lib.getDocument({data:bytes.slice(0), disableWorker:true, isEvalSupported:false}).promise;
      let out=""; for(let p=1;p<=Math.min(pdf.numPages,25);p++){ const pg=await pdf.getPage(p); const tc=await pg.getTextContent(); out+=tc.items.map(i=>i.str).join(" ")+"\n"; }
      return out;
    }
    if(n.endsWith(".docx")){
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
      const r = await window.mammoth.extractRawText({arrayBuffer:bytes.slice(0)}); return r.value;
    }
  }catch(e){ console.warn(e); }
  return "";
}
async function onDraftFile(file){
  if(!file) return;
  const d = UI.draft; const bytes = await file.arrayBuffer();
  d.fileName=file.name; d.fileSize=file.size; d.fileBytes=bytes;
  toast("Reading "+esc(file.name)+"…");
  const text = await extractText(file, bytes);
  if(text.trim()){ d.text = text.slice(0,60000);
    if(!d.title){ const first = text.trim().split("\n").find(l=>l.trim().length>12); if(first) d.title = first.trim().slice(0,200); } }
  render();
}

  title:"AI-Assisted Desk Screening and Editor Trust: A Vignette Experiment with Journal Editors in Thailand and the UK",
  abstract:"Journals increasingly use AI tools to screen submissions, yet little is known about whether editors and authors see AI-assisted decisions as fair. We report a pre-registered factorial vignette experiment with 412 academics in Thailand and the United Kingdom. Participants evaluated desk decisions that varied by decision maker (human, AI-assisted human, automated AI), outcome (accept for review or reject), explanation (none or itemised) and the presence of a verifiable audit trail. AI-assisted decisions with itemised explanations were rated as fair as human decisions, while fully automated rejections were rated markedly less fair (d = 0.61). A visible audit trail raised trust in rejections by 0.4 scale points. We discuss implications for responsible AI adoption in editorial workflows.",
  keywords:"peer review, AI in publishing, organisational justice, trust, research integrity",
  text:`1. Introduction\nEditorial offices face rising submission volumes. AI screening tools promise faster desk decisions, but their legitimacy depends on whether researchers perceive them as procedurally fair (Colquitt, 2001) and whether they trust the technology (McKnight et al., 2011).\n2. Method\nWe pre-registered a 3x2x2x2 between-subjects vignette experiment on OSF. 412 academics (Thailand n = 198; UK n = 214) were recruited from corresponding authors in OpenAlex. Measures: procedural and informational justice (Colquitt 2001, alpha = .89), trust in technology (alpha = .91). Ethics approval: institutional review board, ref. RI-2026-031. Analyses used OLS with robust standard errors and multi-group comparisons by country.\n3. Results\nAutomated AI rejections were rated less fair than human rejections (d = 0.61, p < .001). Itemised explanations closed most of the gap for AI-assisted decisions. Audit trails increased trust in rejections (b = 0.40, 95% CI 0.22 to 0.58). Country differences were small.\n4. Discussion\nResults support AI as an assistant rather than a decision maker, and suggest transparency mechanisms such as verifiable logs can raise legitimacy. Limitations: hypothetical vignettes, self-selected respondents.\nData availability: data and code on OSF.`};

async function edDecide(id){
  const ms = msById(id), a = UI.edPick.a, note = ($("#ed-note").value||"").trim();
  const agrees = a===ms.ai.recommendation;
  if(!agrees && note.length<10){ toast("Add a short reason when you override the AI Editor."); $("#ed-note").focus(); return; }
  ms.editorDecision = {action:a, agreesWithAI:agrees, note, at:now(), by:S.user.name};
  await chain("EditorDecision", id, {action:a, agreesWithAI:agrees});
  if(a==="send_to_review"){ ms.status="in_review"; toast("Sent to the review pool. Two reviewer slots are open."); }
  else if(a==="revise_before_review"){ ms.status="pre_revise"; toast("Author asked to revise before review."); }
  else { ms.status="desk_rejected";
    const back = ms.escrow; S.pools.reviewer -= back; ms.escrow = 0;
    if(isMine(ms)) credit(back, "Reviewer reserve returned after desk rejection", id);
    await chain("EscrowReturned", id, {amount:back});
    toast(`Desk rejected. ${back} tPLIB reviewer reserve returned to the author.`); }
  UI.edPick=null; save(); render();
}

async function simReviewer(id){
  const ms = msById(id); const n = ms.reviews.length;
  const tpl = SIM_REVIEWS[n % SIM_REVIEWS.length];
  const alias = "Reviewer R-"+(20+Math.floor(Math.random()*70));
  const rv = {id:"rv-"+rid(3), reviewerId:"sim-"+rid(2), alias, status:"submitted", acceptedAt:now()-9*DAY, dueAt:now()+5*DAY, submittedAt:now()-Math.floor(Math.random()*3)*DAY, recommendation:tpl.recommendation, form:JSON.parse(JSON.stringify(tpl.form))};
  ms.escrow = Math.max(0, ms.escrow-BASE_REWARD);
  ms.reviews.push(rv);
  await chain("ReviewerAssigned", id, {reviewer:alias.replace("Reviewer ",""), reserved:BASE_REWARD});
  rv.coach = await runCoach(ms, rv.form);
  await chain("ReviewSubmitted", id, {reviewer:alias.replace("Reviewer ",""), reportHash:await sha256(JSON.stringify(rv.form))});
  save(); render(); toast(`${alias} accepted and submitted a report. It's waiting for your validation.`);

async function validate(id, rvId, btn){
  const ms = msById(id), rv = ms.reviews.find(r=>r.id===rvId);
  const Q = Number(UI.qv[rvId] ?? (rv.coach?rv.coach.suggested_Q:1)), T = timeliness(rv), C = UI.cv[rvId]===false?0:1;
  const R = reward(BASE_REWARD,Q,T,C);
  rv.status="validated"; rv.Q=Q; rv.T=T; rv.C=C; rv.reward=R; rv.validatedAt=now();
  S.pools.reviewer -= R;
  if(R < BASE_REWARD) await chain("EscrowReturned", id, {amount:Math.round((BASE_REWARD-R)*100)/100});
  await chain("ReviewValidated", id, {reviewer:rv.alias?rv.alias.replace("Reviewer ",""):"you"});
  await chain("RewardReleased", null, {R, batched:true});
  if(rv.reviewerId===S.user.id){
    credit(R, "Review reward (validated)", id);
    S.reputation.validated += 1; S.reputation.attestations.unshift({msId:id, at:now(), journal:journal(ms.journalId).short, Q});
    await chain("ReputationAttested", null, {item:"Validated review, "+journal(ms.journalId).short});
    burst("+"+fmt(R), btn);
  }
  save(); render(); toast(`Validated. <span class="mono">${fmt(R)} tPLIB</span> released to ${rv.reviewerId===S.user.id?"you":esc(rv.alias)} in the next batched payout.`);
}

async function verifyFile(file){
  const salt = ($("#vf-salt").value||"").trim(); const out = $("#vf-out");
  const bytes = await file.arrayBuffer();
  const candidates = S.manuscripts.flatMap(m=>m.versions.map(v=>({m,v})));
  for(const {m,v} of candidates){
    if(salt && !v.salt.startsWith(salt)) continue;
    const h = await saltedHash(bytes, v.salt);
    if(h===v.hash){ out.innerHTML = `<div class="verdict ok">${I.check.replace('<svg','<svg width="18" height="18"')}Match: ${m.id} version ${v.v}, recorded ${ftime(v.at)}</div>`; return; }
  }
  out.innerHTML = `<div class="verdict bad">No recorded version matches this file${salt?" and salt":""}.</div>`;
}
